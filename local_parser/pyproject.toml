[project]
name = "care-n8n-local-parser"
version = "0.1.0"
description = "n8n 側的本地文件解析服務（PDF／Office／HTML → 純文字）"
# 與 Dockerfile 的 python:3.11-slim-bookworm 一致
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "python-multipart==0.0.20",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "beautifulsoup4==4.12.3",
]

[tool.uv]
package = false
