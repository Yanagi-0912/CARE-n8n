services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.65
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Taipei
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - local-asr
      - local-parser
      - local-tts

  local-asr:
    build:
      context: ./local_asr
    environment:
      ASR_MODEL_ID: ${ASR_MODEL_ID:-MediaTek-Research/Breeze-ASR-26}
      ASR_DEVICE: ${ASR_DEVICE:-}
      ASR_TORCH_DTYPE: ${ASR_TORCH_DTYPE:-}
      ASR_CHUNK_LENGTH_SECONDS: ${ASR_CHUNK_LENGTH_SECONDS:-30}
      ASR_LONG_AUDIO_THRESHOLD_SECONDS: ${ASR_LONG_AUDIO_THRESHOLD_SECONDS:-30}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    ports:
      - "8200:8200"
    volumes:
      - ./local_asr_cache:/root/.cache/huggingface

  local-parser:
    build:
      context: ./local_parser
    environment:
      PARSER_MAX_FILE_SIZE_MB: ${PARSER_MAX_FILE_SIZE_MB:-20}
    ports:
      - "8100:8100"

  local-tts:
    build:
      context: ./local_tts
    environment:
      TTS_PUBLIC_BASE_URL: ${TTS_PUBLIC_BASE_URL:-http://localhost:8800}
      TTS_DEFAULT_LANGUAGE: ${TTS_DEFAULT_LANGUAGE:-zh}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-default}
      TTS_FILE_TTL_SECONDS: ${TTS_FILE_TTL_SECONDS:-3600}
    ports:
      - "8800:8300"
    volumes:
      - ./local_tts_data:/data/tts
